<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firefly Tools | Tile Editor</title>

    <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="plugins/sweetalert2-theme-bootstrap-4/bootstrap-4.min.css" />
    <link rel="stylesheet" href="dist/css/mycss.css" />
  </head>
  <body class="firefly-app">
    <div class="app-shell">
      <aside class="tool-sidebar" aria-label="Firefly Tools navigation">
        <a href="index.html" class="tool-brand">
          <img src="dist/img/logo_firefly.png" alt="Firefly Tools Logo" />
          <span>Firefly Tools</span>
        </a>

        <nav class="tool-nav">
          <a href="index.html">
            <i class="fas fa-cubes" aria-hidden="true"></i>
            <span>Items.dat Tools</span>
          </a>
          <a href="rtconverter.html">
            <i class="fas fa-file-export" aria-hidden="true"></i>
            <span>RT File Converter</span>
          </a>
          <a href="protonhash.html">
            <i class="fas fa-fingerprint" aria-hidden="true"></i>
            <span>Proton Hash</span>
          </a>
          <a href="tileeditor.html" class="active">
            <i class="fas fa-border-all" aria-hidden="true"></i>
            <span>Tile Editor</span>
          </a>
          <a href="renderereditor.html">
            <i class="fas fa-layer-group" aria-hidden="true"></i>
            <span>XML Renderer Editor</span>
          </a>
        </nav>
      </aside>

      <main class="tool-main">
        <header class="tool-topbar">
          <h1>Tile Editor</h1>
        </header>

        <section class="tool-page tile-editor-page">
          <div class="tile-workbench">
            <aside class="tile-panel">
              <section class="tool-card">
                <div class="tool-card-header">
                  <h2>Tile Size</h2>
                </div>
                <div class="tool-card-body">
                  <label for="tileSizeSelect">Preset size</label>
                  <select id="tileSizeSelect" class="form-control">
                    <option value="32x32">32x32</option>
                    <option value="256x160" selected>256x160</option>
                    <option value="64x32">64x32</option>
                    <option value="228x92">228x92</option>
                    <option value="984x64">984x64</option>
                    <option value="880x248">880x248</option>
                    <option value="720x128">720x128</option>
                  </select>

                  <label for="customSizeInput">Custom size</label>
                  <div class="input-row">
                    <input type="text" id="customSizeInput" class="form-control" placeholder="100x50" />
                    <button id="applyCustomSize" class="btn btn-primary" type="button">
                      <i class="fas fa-check" aria-hidden="true"></i>
                      Apply
                    </button>
                  </div>
                </div>
              </section>

              <section class="tool-card">
                <div class="tool-card-header">
                  <h2>Image</h2>
                </div>
                <div class="tool-card-body stacked-actions">
                  <button id="imageButton" class="btn btn-primary" type="button">
                    <i class="fas fa-image" aria-hidden="true"></i>
                    Choose Image
                  </button>
                  <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden />

                  <div class="blank-size-grid">
                    <label for="blankWidth">Blank width</label>
                    <label for="blankHeight">Blank height</label>
                    <input type="number" id="blankWidth" class="form-control" min="1" value="1024" />
                    <input type="number" id="blankHeight" class="form-control" min="1" value="1024" />
                  </div>

                  <button id="newImageButton" class="btn btn-primary" type="button">
                    <i class="fas fa-file" aria-hidden="true"></i>
                    New Blank Image
                  </button>
                  <button id="refreshButton" class="btn btn-default" type="button">
                    <i class="fas fa-sync-alt" aria-hidden="true"></i>
                    Refresh Grid
                  </button>
                  <button id="downloadButton" class="btn btn-success" type="button">
                    <i class="fas fa-download" aria-hidden="true"></i>
                    Download
                  </button>
                </div>
              </section>
            </aside>

            <section class="tile-stage">
              <section class="tool-card tile-controls-card">
                <div class="tool-card-header">
                  <h2>Current Tile</h2>
                  <p id="tileInfo">Tile x 0 y 0</p>
                </div>
                <div class="tool-card-body">
                  <div class="coordinate-grid">
                    <label for="tileX">Tile X</label>
                    <label for="tileY">Tile Y</label>
                    <input type="number" id="tileX" class="form-control" min="0" value="0" />
                    <input type="number" id="tileY" class="form-control" min="0" value="0" />
                  </div>

                  <div class="button-group">
                    <button id="cropButton" class="btn btn-success" type="button">
                      <i class="fas fa-crop-alt" aria-hidden="true"></i>
                      Crop
                    </button>
                    <button id="deleteButton" class="btn btn-danger" type="button">
                      <i class="fas fa-trash" aria-hidden="true"></i>
                      Delete
                    </button>
                    <button id="addButton" class="btn btn-primary" type="button">
                      <i class="fas fa-plus" aria-hidden="true"></i>
                      Add
                    </button>
                  </div>
                </div>
              </section>

              <section class="canvas-shell">
                <div class="canvas-toolbar">
                  <span id="canvasInfo">No image loaded</span>
                  <span id="tileSizeInfo">Tile 256x160</span>
                </div>
                <div class="canvas-scroll">
                  <div class="canvas-container">
                    <canvas id="canvas"></canvas>
                    <div class="grid" aria-hidden="true"></div>
                  </div>
                </div>
              </section>
            </section>
          </div>
        </section>

        <footer class="tool-footer">
          <span><strong>Copyright &copy; 2024 <a href="https://gtps.firefly.my.id">Firefly Team</a>.</strong> All rights reserved.</span>
          <span class="float-right"><b>Firefly Tools</b></span>
        </footer>
      </main>
    </div>

    <script src="plugins/jquery/jquery.min.js"></script>
    <script src="plugins/sweetalert2/sweetalert2.min.js"></script>
    <script src="dist/js/tile_editor.js"></script>
  </body>
</html>
